name: Windows Native Meta-RLR Qualification

on:
  pull_request:
    paths:
      - ".github/workflows/windows-native-meta-rlr-qualification.yml"

permissions:
  contents: read

jobs:
  path-a-core:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out pinned LoopX revision
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install LoopX from this checkout
        run: python -m pip install --disable-pip-version-check -e .

      - name: Verify CLI entry point
        run: loopx --help

      - name: Verify custom-host doctor
        run: loopx doctor --agent-type other-agent

      - name: Verify Meta-RLR agent-onboard packet
        shell: pwsh
        run: |
          $project = Join-Path $env:RUNNER_TEMP "meta-rlr-agent-onboard"
          New-Item -ItemType Directory -Force -Path $project | Out-Null
          $raw = loopx --format json agent-onboard `
            --agent-type other-agent `
            --project $project `
            --goal-id meta-rlr-windows-qualification `
            --agent-id codex-meta-rlr `
            --task-text "Qualify native Windows Meta-RLR" `
            --available-capability shell
          if ($LASTEXITCODE -ne 0) {
            throw "agent-onboard exited with code $LASTEXITCODE"
          }
          $packet = $raw | ConvertFrom-Json
          if (-not $packet.ok) {
            throw "agent-onboard returned ok=false"
          }
          if ($packet.agent_type -ne "other-agent") {
            throw "agent-onboard returned unexpected agent_type: $($packet.agent_type)"
          }
          if (Test-Path (Join-Path $project ".loopx\registry.json")) {
            throw "agent-onboard mutated an unconnected project registry"
          }

      - name: Run official Path A custom-runtime smoke
        run: python examples/custom-runtime-minimal-cli-turn-smoke.py
